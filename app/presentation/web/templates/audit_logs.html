{% extends "base.html" %}
{% block content %}
<section class="toolbar"><h1>Audit Logs</h1></section>
<section class="panel">
  <table>
    <thead><tr><th>Time</th><th>Event</th><th>User</th><th>Status</th><th>Details</th></tr></thead>
    <tbody>
      {% for item in logs %}
      <tr>
        <td>{{ item.timestamp }}</td>
        <td>{{ item.event_type }}</td>
        <td>{{ item.username or "" }}</td>
        <td>{% if item.success %}Success{% else %}Failed{% endif %}</td>
        <td>{{ item.details }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
