{% extends "base.html" %}
{% block content %}
<section class="toolbar"><h1>Resources</h1></section>
<section class="panel">
  <table>
    <thead><tr><th>Server</th><th>URI</th><th>Name</th><th>MIME</th></tr></thead>
    <tbody>
      {% for item in resources %}
      <tr><td>{{ item.server_name }}</td><td>{{ item.uri }}</td><td>{{ item.name }}</td><td>{{ item.mime_type or "" }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
