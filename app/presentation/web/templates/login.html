{% extends "base.html" %}
{% block content %}
<section class="auth-panel">
  <h1>Enterprise MCP Host</h1>
  <p class="muted">Sign in with your enterprise account.</p>
  {% if expired %}
  <div class="alert">Your session expired. Please sign in again.</div>
  {% endif %}
  {% if error %}
  <div class="alert">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="stack">
    <label>
      Username
      <input name="username" autocomplete="username" required>
    </label>
    <label>
      Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign In</button>
  </form>
  <div class="sso-grid">
    <button disabled>Google</button>
    <button disabled>Microsoft</button>
    <button disabled>Facebook</button>
    <button disabled>Enterprise SSO</button>
  </div>
</section>
{% endblock %}
